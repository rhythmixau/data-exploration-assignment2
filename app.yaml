runtime: python
env: flex

runtime_config:
  operating_system: "ubuntu22"
  runtime_version: "3.12"

entrypoint: streamlit run streamlit/app.py --server.port $PORT --server.address=0.0.0.0

resources:
  cpu: 1
  memory_gb: 2.0
  disk_size_gb: 10

automatic_scaling:
  max_num_instances: 1
  min_num_instances: 1
  cpu_utilization:
    target_utilization: 0.6

liveness_check:
  path: "/_stcore/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 1

readiness_check:
  path: "/_stcore/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 1
  app_start_timeout_sec: 300