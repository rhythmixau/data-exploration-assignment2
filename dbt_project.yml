name: 'data_exploration_assignment2'

config-version: 2
version: '0.1'

profile: 'data_exploration_assignment2'

on-run-start:
  - "INSTALL spatial;"
  - "LOAD spatial;"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.0.0", "<2.0.0"]

seeds: 
  +docs:
    node_color: '#cd7f32'

models:
  data_exploration_assignment2:
    +materialized: table
    staging:
      +materialized: view
      +docs:
        node_color: 'silver'
    +docs:
      node_color: 'gold'

dispatch:
  - macro_namespace: dbt_duckdb
    search_order: ['dbt_duckdb_spatial', 'dbt_duckdb']
